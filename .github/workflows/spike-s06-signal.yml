name: spike-s06-signal
on:
  pull_request:
    types: [auto_merge_enabled, auto_merge_disabled]
permissions: {}
jobs:
  signal:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          RUN: ${{ github.run_id }}
        run: gh api "repos/$REPO/statuses/$SHA" -f state=success -f context="spike/s06/$RUN" -f description="$ACTION"
