name: spike-s06-disable
on:
  workflow_dispatch:
    inputs:
      node:
        required: true
      variant:
        required: true
permissions: {}
env:
  Q: 'mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){pullRequest{autoMergeRequest{enabledAt}}}}'
jobs:
  prwrite:
    if: inputs.variant == 'prwrite'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", NODE: "${{ inputs.node }}" }
        run: printf '::notice title=result::%s\n' "$(gh api graphql -f query="$Q" -f id="$NODE" 2>&1 | tr -d '\r\n' | cut -c1-260)"
  prcontents:
    if: inputs.variant == 'prcontents'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", NODE: "${{ inputs.node }}" }
        run: printf '::notice title=result::%s\n' "$(gh api graphql -f query="$Q" -f id="$NODE" 2>&1 | tr -d '\r\n' | cut -c1-260)"
