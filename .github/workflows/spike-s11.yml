name: spike-s11
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
permissions: {}
jobs:
  forge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BASE: ${{ inputs.sha }}
      NAME: dependabot[bot]
      MAIL: 49699333+dependabot[bot]@users.noreply.github.com
    steps:
      - run: |
          c=$(gh api -X PUT "repos/$REPO/contents/s11-token.txt" -f message='test: S-11 token contents' -f content=czExCg== -f branch=s11-token -f "author[name]=$NAME" -f "author[email]=$MAIL" --jq .commit.sha 2>&1 | tail -1 | cut -c1-120)
          printf '::notice title=contents::%s\n' "$c"
          t=$(gh api "repos/$REPO/git/commits/$BASE" --jq .tree.sha)
          g=$(gh api "repos/$REPO/git/commits" -f message='test: S-11 token git data' -f tree="$t" -f "parents[]=$BASE" -f "author[name]=$NAME" -f "author[email]=$MAIL" --jq .sha 2>&1 | tail -1 | cut -c1-120)
          printf '::notice title=gitdata::%s\n' "$g"
