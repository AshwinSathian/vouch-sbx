name: spike-s09
on:
  pull_request:
    types: [edited]
permissions: {}
jobs:
  edited:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: record the base change
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          FROM: ${{ github.event.changes.base.ref.from }}
          TO: ${{ github.event.pull_request.base.ref }}
        run: gh api "repos/$REPO/statuses/$SHA" -f state=success -f context=spike/s09-edited -f description="from=$FROM to=$TO"
