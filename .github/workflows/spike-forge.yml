name: spike-forge
on: pull_request
permissions: {}
jobs:
  forge:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: forge the gate status with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh api "repos/$REPO/statuses/$SHA" -f state=success -f context=vouch/tier/main -f description=forged-by-github-token
