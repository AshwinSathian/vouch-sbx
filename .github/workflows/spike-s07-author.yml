name: spike-s07-author
on: workflow_dispatch
permissions: {}
jobs:
  author:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      NAME: ${{ github.event.repository.name }}
    steps:
      - run: |
          gh api "repos/$REPO/issues/1/comments" -f body='s07 author probe' >/dev/null
          out=$(gh api graphql -f query='query($o:String!,$n:String!){viewer{login} repository(owner:$o,name:$n){pullRequest(number:1){comments(last:1){nodes{author{__typename login}}}}}}' -f o="$OWNER" -f n="$NAME" 2>&1 | tr -d '\r\n' | cut -c1-280)
          printf '::notice title=author::%s\n' "$out"
