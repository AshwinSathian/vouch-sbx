name: spike-fix-q
run-name: spike-fix-q ${{ inputs.trial }}
on:
  workflow_dispatch:
    inputs:
      trial:
        required: true
permissions: {}
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      keys: ${{ steps.r.outputs.keys }}
    steps:
      - id: r
        run: echo 'keys=["pr-1","pr-2"]' >> "$GITHUB_OUTPUT"
  worker:
    needs: route
    runs-on: ubuntu-latest
    environment: vouch
    strategy:
      fail-fast: false
      matrix:
        key: ${{ fromJSON(needs.route.outputs.keys || format('["run-{0}"]', github.run_id)) }}
    concurrency:
      group: "fix-${{ matrix.key }}"
      cancel-in-progress: false
      queue: max
    steps:
      - env:
          GROUP: "fix-${{ matrix.key }}"
        run: |
          echo "::notice title=group::$GROUP"
          sleep 35
